<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paiement Bibliothèque</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-brand">Bibliothèque Universitaire</div>
    <nav class="nav-links">
      <a href="welcome.html">Home</a>
      <a href="inscription.html">Inscription</a>
      <a href="paiement.html">Paiement</a>
      <a href="bulletin.html">Bulletin</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card form-card">
      <h2>Paiement Bibliothèque</h2>
      <form>
        <label for="matriculePay">Matricule</label>
        <input type="text" id="matriculePay" name="matriculePay" placeholder="Numéro de matricule">

        <label for="filiere">Filière</label>
        <select id="filiere" name="filiere">
          <option>Droit</option>
          <option>Management</option>
          <option>Ingénierie</option>
          <option>Art</option>
          <option>Finance</option>
          <option>Génie Logiciel</option>
          <option>Comptabilité</option>
        </select>

        <label for="niveau">Niveau</label>
        <select id="niveau" name="niveau">
          <option>Licence 1</option>
          <option>Licence 2</option>
          <option>Licence 3</option>
          <option>Master 1</option>
          <option>Master 2</option>
        </select>

        <label for="montant">Montant</label>
        <input type="text" id="montant" name="montant" placeholder="Montant à payer">

        <label for="datePaiement">Date</label>
        <input type="date" id="datePaiement" name="datePaiement">

        <label for="solde">Solde</label>
        <input type="text" id="solde" name="solde" placeholder="Solde restant">

        <button type="submit" class="button btn-primary">Enregistrer</button>
      </form>
      <p class="form-note"><a href="welcome.html">Retour à l'accueil</a></p>
    </section>
  </main>
</body>
</html>
