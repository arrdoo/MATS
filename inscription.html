<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription Étudiant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-brand">Bibliothèque Universitaire</div>
    <nav class="nav-links">
      <a href="welcome.html">Home</a>
      <a href="inscription.html">Inscription</a>
      <a href="paiement.html">Paiement</a>
      <a href="bulletin.html">Bulletin</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main class="page-shell">
    <section class="card form-card">
      <h2>Inscription Étudiant</h2>
      <form>
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" name="prenom" placeholder="Votre prénom">

        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" placeholder="Votre nom">

        <label for="login">Login</label>
        <input type="text" id="login" name="login" placeholder="Identifiant">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Mot de passe">

        <label for="profil">Profil</label>
        <select id="profil" name="profil">
          <option value="etudiant">Étudiant</option>
          <option value="professeur">Professeur</option>
          <option value="personnel">Personnel</option>
        </select>

        <label for="sexe">Sexe</label>
        <select id="sexe" name="sexe">
          <option value="f">Femme</option>
          <option value="h">Homme</option>
          <option value="autre">Autre</option>
        </select>

        <label for="matricule">Matricule</label>
        <input type="text" id="matricule" name="matricule" placeholder="Numéro de matricule">

        <button type="submit" class="button btn-primary">Enregistrer</button>
      </form>
      <p class="form-note">Après validation, <a href="welcome.html">retournez à la page d'accueil</a>.</p>
    </section>
  </main>
</body>
</html>
